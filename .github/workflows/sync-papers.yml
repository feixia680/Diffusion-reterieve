name: Sync research papers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'papers/**/*.pdf'

permissions:
  contents: write

jobs:
  sync-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download open-access PDFs
        shell: bash
        run: |
          set -euo pipefail

          download() {
            url="$1"
            out="$2"
            mkdir -p "$(dirname "$out")"
            if [ -s "$out" ]; then
              echo "exists: $out"
              return 0
            fi
            echo "downloading: $out"
            curl -L --fail --retry 4 --retry-delay 3 \
              -A 'Mozilla/5.0 paper-sync' \
              "$url" -o "$out"
          }

          # 01 Core: dLLM × Dynamic Retrieval / RAG
          download 'https://arxiv.org/pdf/2606.06474' 'papers/01_core_dynamic_retrieval/ICML2026_SARDI.pdf'
          download 'https://arxiv.org/pdf/2601.11342' 'papers/01_core_dynamic_retrieval/ARXIV2026_SPREAD.pdf'
          download 'https://arxiv.org/pdf/2603.17677' 'papers/01_core_dynamic_retrieval/ARXIV2026_ARAM.pdf'

          # 02 dLLM Search Agents / Tool Use
          download 'https://arxiv.org/pdf/2602.07035' 'papers/02_search_agents_tool_use/SIGIR2026_DLLM_Searcher.pdf'

          # 03 Diffusion as Retriever / Retrieval Representation
          download 'https://aclanthology.org/2026.acl-industry.69.pdf' 'papers/03_diffusion_as_retriever/ACL2026_Diffusion_Pretrained_Embeddings.pdf'
          download 'https://arxiv.org/pdf/2605.07210' 'papers/03_diffusion_as_retriever/ARXIV2026_DiffRetriever.pdf'
          download 'https://arxiv.org/pdf/2603.06397' 'papers/03_diffusion_as_retriever/ICML2026_R4T_RL_Compiled_Diffusion.pdf'

          # 04 dLLM dynamics: phenomenon-first idea mining
          download 'https://arxiv.org/pdf/2508.19982' 'papers/04_dllm_dynamics_for_idea_mining/ICLR2026_Prophet_Early_Answer_Convergence.pdf'
          download 'https://arxiv.org/pdf/2511.05563' 'papers/04_dllm_dynamics_for_idea_mining/ICML2026_LookUM.pdf'
          download 'https://arxiv.org/pdf/2602.10953' 'papers/04_dllm_dynamics_for_idea_mining/ICML2026_SOAR.pdf'
          download 'https://arxiv.org/pdf/2603.12996' 'papers/04_dllm_dynamics_for_idea_mining/ICML2026_DAPD.pdf'
          download 'https://arxiv.org/pdf/2601.22954' 'papers/04_dllm_dynamics_for_idea_mining/ICML2026_Residual_Context_Diffusion.pdf'
          download 'https://arxiv.org/pdf/2603.20216' 'papers/04_dllm_dynamics_for_idea_mining/ICML2026_CoDiLA.pdf'
          download 'https://arxiv.org/pdf/2509.21474' 'papers/04_dllm_dynamics_for_idea_mining/ICML2026_d2_Trajectory_Likelihood.pdf'
          download 'https://arxiv.org/pdf/2606.08048' 'papers/04_dllm_dynamics_for_idea_mining/ICML2026_PoE_Bridge.pdf'

          # 05 High-value 2026 preprints exposing unique dLLM phenomena
          download 'https://arxiv.org/pdf/2604.26841' 'papers/05_high_value_preprints/ARXIV2026_Associative_Memory_DLM.pdf'
          download 'https://arxiv.org/pdf/2604.11035' 'papers/05_high_value_preprints/ARXIV2026_Introspective_DLM.pdf'

          # 06 Adjacent dynamic-retrieval papers: useful controls / transferable ideas
          download 'https://aclanthology.org/2026.acl-long.1734.pdf' 'papers/06_adjacent_dynamic_retrieval/ACL2026_Adaptive_Retrieval_for_Reasoning.pdf'
          download 'https://aclanthology.org/2026.findings-acl.812.pdf' 'papers/06_adjacent_dynamic_retrieval/ACLFindings2026_QuCo_RAG.pdf'

          # 07 ICLR 2026 — extended dLLM dynamics / inference papers
          download 'https://proceedings.iclr.cc/paper_files/paper/2026/file/2f992baabfee60ab6add5e4f63b414b1-Paper-Conference.pdf' 'papers/07_iclr2026_dllm_extended/ICLR2026_Optimal_Parallel_Samplers.pdf'
          download 'https://proceedings.iclr.cc/paper_files/paper/2026/file/f930c6e1292a1160189a0734f22b465b-Paper-Conference.pdf' 'papers/07_iclr2026_dllm_extended/ICLR2026_FlashDLM.pdf'
          download 'https://proceedings.iclr.cc/paper_files/paper/2026/file/e82cfb0ee6ce329759d0d3c90fbbccc4-Paper-Conference.pdf' 'papers/07_iclr2026_dllm_extended/ICLR2026_SureLock.pdf'
          download 'https://proceedings.iclr.cc/paper_files/paper/2026/file/585979c057a1b30796cf317063559638-Paper-Conference.pdf' 'papers/07_iclr2026_dllm_extended/ICLR2026_ReFusion.pdf'
          download 'https://proceedings.iclr.cc/paper_files/paper/2026/file/a1598ba0aa7bd7bdf18e0ad04d993edc-Paper-Conference.pdf' 'papers/07_iclr2026_dllm_extended/ICLR2026_SparseD.pdf'
          download 'https://proceedings.iclr.cc/paper_files/paper/2026/file/a886eb099223bcbdbd65bc52c852fd61-Paper-Conference.pdf' 'papers/07_iclr2026_dllm_extended/ICLR2026_Beyond_Masks_DID.pdf'
          download 'https://proceedings.iclr.cc/paper_files/paper/2026/file/257c140d25d1f7fc10f8ae5e17296299-Paper-Conference.pdf' 'papers/07_iclr2026_dllm_extended/ICLR2026_Priming_Vulnerability.pdf'
          download 'https://proceedings.iclr.cc/paper_files/paper/2026/file/bdff657cb9351656c025da8e1dc538a4-Paper-Conference.pdf' 'papers/07_iclr2026_dllm_extended/ICLR2026_DeepRAG.pdf'

          # 08 ACL 2026 Main — dLLM dynamics + adaptive retrieval/orchestration
          download 'https://aclanthology.org/2026.acl-long.1231.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_Diffuse_Thinking.pdf'
          download 'https://aclanthology.org/2026.acl-long.1978.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_Denoising_Process_Rewards.pdf'
          download 'https://aclanthology.org/2026.acl-long.311.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_UNCODE_Decoding_Biases.pdf'
          download 'https://aclanthology.org/2026.acl-long.819.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_Semantic_Aware_Adaptive_Denoising.pdf'
          download 'https://aclanthology.org/2026.acl-long.994.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_d_TreeRPO.pdf'
          download 'https://aclanthology.org/2026.acl-long.1791.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_QuDAR.pdf'
          download 'https://aclanthology.org/2026.acl-long.1793.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_SPARKLE.pdf'
          download 'https://aclanthology.org/2026.acl-long.939.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_R3AG.pdf'
          download 'https://aclanthology.org/2026.acl-long.2013.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_Environment_Aware_IR.pdf'
          download 'https://aclanthology.org/2026.acl-long.192.pdf' 'papers/08_acl2026_dllm_adaptive_retrieval/ACL2026_GuarantRAG.pdf'

      - name: Commit PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers
          if git diff --cached --quiet; then
            echo 'No PDF changes.'
          else
            git commit -m 'Sync open-access research PDFs'
            git push
          fi
